<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>眼動追蹤分析系統</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1em;
        opacity: 0.9;
      }

      .content {
        padding: 30px;
      }

      .control-panel {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 30px;
        border: 2px solid #e9ecef;
      }

      .control-panel h2 {
        color: #495057;
        margin-bottom: 20px;
        font-size: 1.5em;
      }

      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .btn {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        color: white;
      }

      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
      }

      .btn-success {
        background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        color: white;
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
      }

      .btn-warning {
        background: linear-gradient(135deg, #ffd43b 0%, #fcc419 100%);
        color: #495057;
      }

      .btn-warning:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 212, 59, 0.4);
      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .status-running {
        background: #51cf66;
        animation: pulse 2s infinite;
      }

      .status-stopped {
        background: #ff6b6b;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      .analysis-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .analysis-card {
        background: white;
        border-radius: 10px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-left: 4px solid #667eea;
      }

      .analysis-card h3 {
        color: #495057;
        margin-bottom: 15px;
        font-size: 1.3em;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #e9ecef;
      }

      .metric:last-child {
        border-bottom: none;
      }

      .metric-label {
        font-weight: 600;
        color: #6c757d;
      }

      .metric-value {
        font-weight: 700;
        color: #495057;
      }

      .pupil-section {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
      }

      .pupil-section h4 {
        color: #495057;
        margin-bottom: 10px;
        font-size: 1.1em;
      }

      .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-left: 4px solid;
      }

      .alert-success {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
      }

      .alert-danger {
        background: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
      }

      .alert-info {
        background: #d1ecf1;
        border-color: #17a2b8;
        color: #0c5460;
      }

      .fcm-panel {
        background: #fff3cd;
        border: 2px solid #ffeaa7;
        border-radius: 10px;
        padding: 25px;
        margin-top: 20px;
      }

      .fcm-panel h3 {
        color: #856404;
        margin-bottom: 15px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #495057;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 2px solid #e9ecef;
        border-radius: 5px;
        font-size: 1em;
        transition: border-color 0.3s ease;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .button-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .analysis-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>👁️ 眼動追蹤分析系統</h1>
        <p>即時監控眨眼頻率和瞳孔狀態，智能警報系統</p>
      </div>

      <div class="content">
        <!-- 控制面板 -->
        <div class="control-panel">
          <h2>🎮 控制面板</h2>
          <div class="button-group">
            <button class="btn btn-primary" onclick="startTracking()"> ▶️ 開始追蹤 </button>
            <button class="btn btn-danger" onclick="stopTracking()"> ⏹️ 停止追蹤 </button>
            <button class="btn btn-success" onclick="refreshAnalysis()"> 🔄 刷新分析 </button>
            <button class="btn btn-warning" onclick="sendTestFCM()"> 📱 測試 FCM </button>
          </div>
          <div id="status-display">
            <span class="status-indicator status-stopped"></span>
            <strong>狀態：</strong><span id="status-text">已停止</span>
          </div>
        </div>

        <!-- 載入指示器 -->
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>處理中...</p>
        </div>

        <!-- 分析結果 -->
        <div id="analysis-results" class="analysis-grid">
          <!-- 眨眼分析 -->
          <div class="analysis-card">
            <h3>👁️ 眨眼分析</h3>
            <div class="metric">
              <span class="metric-label">眨眼頻率</span>
              <span class="metric-value" id="blink-frequency">0.0 次/分鐘</span>
            </div>
            <div class="metric">
              <span class="metric-label">眨眼次數</span>
              <span class="metric-value" id="blink-count">0</span>
            </div>
            <div class="metric">
              <span class="metric-label">分析窗口</span>
              <span class="metric-value" id="window-seconds">15 秒</span>
            </div>
          </div>

          <!-- 瞳孔分析 -->
          <div class="analysis-card">
            <h3>🔍 瞳孔分析</h3>
            <div class="pupil-section">
              <h4>左眼</h4>
              <div class="metric">
                <span class="metric-label">平均直徑</span>
                <span class="metric-value" id="left-mean">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">當前直徑</span>
                <span class="metric-value" id="left-current">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">有效性率</span>
                <span class="metric-value" id="left-validity">0.0%</span>
              </div>
            </div>
            <div class="pupil-section">
              <h4>右眼</h4>
              <div class="metric">
                <span class="metric-label">平均直徑</span>
                <span class="metric-value" id="right-mean">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">當前直徑</span>
                <span class="metric-value" id="right-current">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">有效性率</span>
                <span class="metric-value" id="right-validity">0.0%</span>
              </div>
            </div>
          </div>

          <!-- 系統狀態 -->
          <div class="analysis-card">
            <h3>⚙️ 系統狀態</h3>
            <div class="metric">
              <span class="metric-label">最後更新</span>
              <span class="metric-value" id="last-update">--</span>
            </div>
            <div class="metric">
              <span class="metric-label">數據樣本</span>
              <span class="metric-value" id="data-samples">0</span>
            </div>
            <div class="metric">
              <span class="metric-label">警報狀態</span>
              <span class="metric-value" id="alert-status">正常</span>
            </div>
          </div>
        </div>

        <!-- FCM 測試面板 -->
        <div class="fcm-panel">
          <h3>📱 FCM 通知測試</h3>
          <div class="form-group">
            <label for="fcm-title">通知標題</label>
            <input type="text" id="fcm-title" value="眼動追蹤警報" placeholder="輸入通知標題" />
          </div>
          <div class="form-group">
            <label for="fcm-body">通知內容</label>
            <textarea id="fcm-body" rows="3" placeholder="輸入通知內容">這是一個測試通知</textarea>
          </div>
          <button class="btn btn-warning" onclick="sendCustomFCM()"> 📤 發送自定義通知 </button>
        </div>
      </div>
    </div>

    <script>
      let isTracking = false;
      let updateInterval;

      // 開始追蹤
      async function startTracking() {
        showLoading(true);
        try {
          const response = await fetch("/api/start", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
          });
          const result = await response.json();

          if (result.status === "success") {
            isTracking = true;
            updateStatus();
            showAlert("追蹤已開始", "success");
            startAutoUpdate();
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("啟動失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 停止追蹤
      async function stopTracking() {
        showLoading(true);
        try {
          const response = await fetch("/api/stop", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
          });
          const result = await response.json();

          if (result.status === "success") {
            isTracking = false;
            updateStatus();
            showAlert("追蹤已停止", "info");
            stopAutoUpdate();
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("停止失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 刷新分析
      async function refreshAnalysis() {
        showLoading(true);
        try {
          const response = await fetch("/api/analysis");
          const result = await response.json();

          if (result.status === "success") {
            updateAnalysisDisplay(result.data);
            showAlert("分析數據已更新", "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("刷新失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 發送測試 FCM
      async function sendTestFCM() {
        showLoading(true);
        try {
          const response = await fetch("/api/send_fcm", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              title: "眼動追蹤測試",
              body: "這是一個測試通知",
              data: {
                type: "test",
                timestamp: new Date().toISOString(),
              },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showAlert("FCM 測試通知已發送", "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("FCM 發送失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 發送自定義 FCM
      async function sendCustomFCM() {
        const title = document.getElementById("fcm-title").value;
        const body = document.getElementById("fcm-body").value;

        if (!title || !body) {
          showAlert("請填寫標題和內容", "danger");
          return;
        }

        showLoading(true);
        try {
          const response = await fetch("/api/send_fcm", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              title: title,
              body: body,
              data: {
                type: "custom",
                timestamp: new Date().toISOString(),
              },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showAlert("自定義 FCM 通知已發送", "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("FCM 發送失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 更新狀態顯示
      function updateStatus() {
        const statusIndicator = document.querySelector(".status-indicator");
        const statusText = document.getElementById("status-text");

        if (isTracking) {
          statusIndicator.className = "status-indicator status-running";
          statusText.textContent = "運行中";
        } else {
          statusIndicator.className = "status-indicator status-stopped";
          statusText.textContent = "已停止";
        }
      }

      // 更新分析顯示
      function updateAnalysisDisplay(data) {
        // 眨眼分析
        document.getElementById("blink-frequency").textContent = `${data.blink_frequency.toFixed(1)} 次/分鐘`;
        document.getElementById("blink-count").textContent = data.blink_count;
        document.getElementById("window-seconds").textContent = `${data.window_seconds} 秒`;

        // 瞳孔分析
        const leftStats = data.pupil_statistics.left_eye;
        const rightStats = data.pupil_statistics.right_eye;
        const currentSizes = data.current_pupil_sizes;

        document.getElementById("left-mean").textContent = `${leftStats.mean_diameter.toFixed(2)} mm`;
        document.getElementById("left-current").textContent = currentSizes.left_eye ? `${currentSizes.left_eye.toFixed(2)} mm` : "無數據";
        document.getElementById("left-validity").textContent = `${leftStats.validity_rate.toFixed(1)}%`;

        document.getElementById("right-mean").textContent = `${rightStats.mean_diameter.toFixed(2)} mm`;
        document.getElementById("right-current").textContent = currentSizes.right_eye ? `${currentSizes.right_eye.toFixed(2)} mm` : "無數據";
        document.getElementById("right-validity").textContent = `${rightStats.validity_rate.toFixed(1)}%`;

        // 系統狀態
        document.getElementById("last-update").textContent = new Date(data.timestamp).toLocaleTimeString();
        document.getElementById("data-samples").textContent = leftStats.valid_samples + rightStats.valid_samples;

        // 警報狀態檢查
        let alertStatus = "正常";
        if (data.blink_frequency > 20) alertStatus = "眨眼頻率過高";
        if (leftStats.validity_rate < 50 || rightStats.validity_rate < 50) alertStatus = "數據有效性低";

        document.getElementById("alert-status").textContent = alertStatus;
      }

      // 開始自動更新
      function startAutoUpdate() {
        updateInterval = setInterval(refreshAnalysis, 5000); // 每5秒更新一次
      }

      // 停止自動更新
      function stopAutoUpdate() {
        if (updateInterval) {
          clearInterval(updateInterval);
          updateInterval = null;
        }
      }

      // 顯示載入指示器
      function showLoading(show) {
        const loading = document.getElementById("loading");
        loading.style.display = show ? "block" : "none";
      }

      // 顯示警報
      function showAlert(message, type) {
        // 移除現有警報
        const existingAlert = document.querySelector(".alert");
        if (existingAlert) {
          existingAlert.remove();
        }

        // 創建新警報
        const alert = document.createElement("div");
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `
                <strong>${type === "success" ? "✅" : type === "danger" ? "❌" : "ℹ️"}</strong>
                ${message}
                <button type="button" class="close" onclick="this.parentElement.remove()" style="float: right; background: none; border: none; font-size: 1.5em; cursor: pointer;">&times;</button>
            `;

        // 插入到頁面頂部
        const content = document.querySelector(".content");
        content.insertBefore(alert, content.firstChild);

        // 自動移除警報
        setTimeout(() => {
          if (alert.parentElement) {
            alert.remove();
          }
        }, 5000);
      }

      // 頁面載入時初始化
      document.addEventListener("DOMContentLoaded", function () {
        updateStatus();
        refreshAnalysis();
      });
    </script>
  </body>
</html>
