<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>眼動追蹤分析系統</title>
    <style>
      :root {
        --bg-color: #f5f5f5;
        --card-bg: #ffffff;
        --text-color: #000000;
        --border-color: #000000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: var(--bg-color);
        min-height: 100vh;
        padding: 30px;
        color: var(--text-color);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        margin-bottom: 30px;
      }

      .left-column,
      .right-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .title-card {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        padding: 20px;
        margin-bottom: 15px;
      }

      .title-card h1 {
        font-size: 2em;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .title-card p {
        font-size: 1em;
        opacity: 0.8;
      }

      .control-panel {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        padding: 20px;
        margin-bottom: 15px;
      }

      .control-panel h2 {
        color: var(--text-color);
        margin-bottom: 15px;
        font-size: 1.3em;
        font-weight: bold;
      }

      .button-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }

      .btn {
        padding: 10px 20px;
        border: 2px solid var(--border-color);
        background: var(--card-bg);
        color: var(--text-color);
        font-size: 0.9em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-radius: 0;
      }

      .btn:hover {
        background: var(--border-color);
        color: var(--card-bg);
      }

      .status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid var(--border-color);
        margin-right: 8px;
        background: var(--card-bg);
      }

      .status-running {
        background: var(--border-color);
      }

      .status-stopped {
        background: var(--card-bg);
      }

      .analysis-card {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        padding: 20px;
        margin-bottom: 15px;
      }

      .analysis-card h3 {
        color: var(--text-color);
        margin-bottom: 15px;
        font-size: 1.2em;
        font-weight: bold;
      }

      .metric {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-color);
      }

      .metric:last-child {
        border-bottom: none;
      }

      .metric-label {
        font-weight: 600;
        color: var(--text-color);
      }

      .metric-value {
        font-weight: 700;
        color: var(--text-color);
      }

      .pupil-section {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 12px;
        margin-top: 12px;
      }

      .pupil-section h4 {
        color: var(--text-color);
        margin-bottom: 8px;
        font-size: 1em;
        font-weight: bold;
      }

      .alert {
        padding: 12px;
        border: 2px solid var(--border-color);
        margin-bottom: 15px;
        background: var(--card-bg);
        color: var(--text-color);
      }

      .fcm-panel {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        padding: 20px;
      }

      .fcm-panel h3 {
        color: var(--text-color);
        margin-bottom: 12px;
        font-weight: bold;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: var(--text-color);
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 2px solid var(--border-color);
        background: var(--card-bg);
        color: var(--text-color);
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #4caf50;
      }

      /* 新增的測試按鈕樣式 */
      .test-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--border-color);
      }

      .overlay-config {
      }

      .overlay-config label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: var(--text-color);
      }

      .overlay-config select {
        width: 100%;
        padding: 8px;
        border: 2px solid var(--border-color);
        background: var(--card-bg);
        color: var(--text-color);
        font-family: inherit;
        margin-bottom: 10px;
      }

      .overlay-config select:focus {
        outline: none;
        border-color: #4caf50;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      .spinner {
        border: 4px solid var(--card-bg);
        border-top: 4px solid var(--border-color);
        border-radius: 0;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .main-content {
          grid-template-columns: 1fr;
        }

        .button-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main-content">
        <!-- 左列 -->
        <div class="left-column">
          <!-- 標題卡片 -->
          <div class="title-card">
            <h1>眼動追蹤分析系統</h1>
            <p>即時監控眨眼頻率和瞳孔狀態，智能警報系統</p>
          </div>

          <!-- 控制面板 -->
          <div class="control-panel">
            <h2>控制面板</h2>
            <div class="button-group">
              <button class="btn" onclick="startTracking()">開始追蹤</button>
              <button class="btn" onclick="stopTracking()">停止追蹤</button>
              <button class="btn" onclick="refreshAnalysis()">刷新分析</button>
            </div>
            <div id="status-display">
              <span class="status-indicator status-stopped"></span>
              <strong>狀態：</strong><span id="status-text">已停止</span>
            </div>
          </div>

          <!-- 眨眼分析 -->
          <div class="analysis-card">
            <h3>眨眼分析</h3>
            <div class="metric">
              <span class="metric-label">眨眼頻率</span>
              <span class="metric-value" id="blink-frequency">0.0 次/分鐘</span>
            </div>
            <div class="metric">
              <span class="metric-label">眨眼次數</span>
              <span class="metric-value" id="blink-count">0</span>
            </div>
            <div class="metric">
              <span class="metric-label">分析窗口</span>
              <span class="metric-value" id="window-seconds">15 秒</span>
            </div>
          </div>

          <!-- 瞳孔分析 -->
          <div class="analysis-card">
            <h3>瞳孔分析</h3>
            <div class="pupil-section">
              <h4>左眼</h4>
              <div class="metric">
                <span class="metric-label">平均直徑</span>
                <span class="metric-value" id="left-mean">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">當前直徑</span>
                <span class="metric-value" id="left-current">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">有效性率</span>
                <span class="metric-value" id="left-validity">0.0%</span>
              </div>
            </div>
            <div class="pupil-section">
              <h4>右眼</h4>
              <div class="metric">
                <span class="metric-label">平均直徑</span>
                <span class="metric-value" id="right-mean">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">當前直徑</span>
                <span class="metric-value" id="right-current">0.00 mm</span>
              </div>
              <div class="metric">
                <span class="metric-label">有效性率</span>
                <span class="metric-value" id="right-validity">0.0%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 右列 -->
        <div class="right-column">
          <!-- 系統狀態 -->
          <div class="analysis-card">
            <h3>系統狀態</h3>
            <div class="metric">
              <span class="metric-label">最後更新</span>
              <span class="metric-value" id="last-update">--</span>
            </div>
            <div class="metric">
              <span class="metric-label">數據樣本</span>
              <span class="metric-value" id="data-samples">0</span>
            </div>
            <div class="metric">
              <span class="metric-label">警報狀態</span>
              <span class="metric-value" id="alert-status">正常</span>
            </div>
          </div>

          <!-- FCM 測試面板 -->
          <div class="fcm-panel">
            <h3>FCM 通知測試</h3>
            <div class="overlay-config">
              <label for="overlay-type">彈窗類型</label>
              <select id="overlay-type">
                <option value="type1">類型1 (預設)</option>
                <option value="type2">類型2</option>
                <option value="type3">類型3</option>
              </select>
            </div>
            <button class="btn" onclick="sendCustomFCM()">發送自定義彈窗</button>

            <!-- 新增的測試按鈕 -->
            <div class="test-buttons">
              <button class="btn" onclick="sendNewFormatFCM()">呼叫麻糬彈窗</button>
              <button class="btn" onclick="sendOldFormatFCM()">測試提醒通知</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 載入指示器 -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>處理中...</p>
      </div>
    </div>

    <script>
      let isTracking = false;
      let updateInterval;

      // 開始追蹤
      async function startTracking() {
        showLoading(true);
        try {
          const response = await fetch("/api/start", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
          });
          const result = await response.json();

          if (result.status === "success") {
            isTracking = true;
            updateStatus();
            showAlert("追蹤已開始", "success");
            startAutoUpdate();
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("啟動失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 停止追蹤
      async function stopTracking() {
        showLoading(true);
        try {
          const response = await fetch("/api/stop", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
          });
          const result = await response.json();

          if (result.status === "success") {
            isTracking = false;
            updateStatus();
            showAlert("追蹤已停止", "info");
            stopAutoUpdate();
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("停止失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 刷新分析
      async function refreshAnalysis() {
        showLoading(true);
        try {
          const response = await fetch("/api/analysis");
          const result = await response.json();

          if (result.status === "success") {
            updateAnalysisDisplay(result.data);
            showAlert("分析數據已更新", "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("刷新失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 發送自定義 FCM
      async function sendCustomFCM() {
        const overlayType = document.getElementById("overlay-type").value;

        // 根據 overlay_type 設定不同的內容
        let overlayMessage = "";
        switch (overlayType) {
          case "type1":
            overlayMessage = "這是類型1的自定義彈窗內容";
            break;
          case "type2":
            overlayMessage = "這是類型2的自定義彈窗內容";
            break;
          case "type3":
            overlayMessage = "這是類型3的自定義彈窗內容";
            break;
          default:
            overlayMessage = "這是預設的自定義彈窗內容";
        }

        showLoading(true);
        try {
          const response = await fetch("/api/send_fcm", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: {
                data: {
                  show_overlay: "true",
                  overlay_type: overlayType,
                  overlay_message: overlayMessage,
                },
                topic: "test_topic",
              },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showAlert(`自定義 FCM 通知已發送 (${overlayType})`, "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("FCM 發送失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 發送新版 FCM 格式（對應 test_fcm.py 中的 test_new_fcm_format）
      async function sendNewFormatFCM() {
        const overlayType = document.getElementById("overlay-type").value;

        showLoading(true);
        try {
          const response = await fetch("/api/send_fcm", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: {
                data: {
                  show_overlay: "true",
                  overlay_type: overlayType,
                  overlay_message: "這是新版格式測試的彈窗",
                },
                topic: "test_topic",
              },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showAlert(`新版格式 FCM 通知已發送 (${overlayType})`, "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("FCM 發送失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 發送舊版 FCM 格式（對應 test_fcm.py 中的 test_old_fcm_format）
      async function sendOldFormatFCM() {
        showLoading(true);
        try {
          const response = await fetch("/api/send_fcm", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              title: "太極麻糬提醒你記得睡覺...",
              body: "別再滑啦！該休息了！",
              topic: "test_topic",
              data: {
                test_key: "test_value",
                timestamp: new Date().toISOString(),
              },
            }),
          });
          const result = await response.json();

          if (result.status === "success") {
            showAlert("舊版格式 FCM 通知已發送", "success");
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          showAlert("FCM 發送失敗: " + error.message, "danger");
        }
        showLoading(false);
      }

      // 更新狀態顯示
      function updateStatus() {
        const statusIndicator = document.querySelector(".status-indicator");
        const statusText = document.getElementById("status-text");

        if (isTracking) {
          statusIndicator.className = "status-indicator status-running";
          statusText.textContent = "運行中";
        } else {
          statusIndicator.className = "status-indicator status-stopped";
          statusText.textContent = "已停止";
        }
      }

      // 更新分析顯示
      function updateAnalysisDisplay(data) {
        // 眨眼分析
        document.getElementById("blink-frequency").textContent = `${data.blink_frequency.toFixed(1)} 次/分鐘`;
        document.getElementById("blink-count").textContent = data.blink_count;
        document.getElementById("window-seconds").textContent = `${data.window_seconds} 秒`;

        // 瞳孔分析
        const leftStats = data.pupil_statistics.left_eye;
        const rightStats = data.pupil_statistics.right_eye;
        const currentSizes = data.current_pupil_sizes;

        document.getElementById("left-mean").textContent = `${leftStats.mean_diameter.toFixed(2)} mm`;
        document.getElementById("left-current").textContent = currentSizes.left_eye ? `${currentSizes.left_eye.toFixed(2)} mm` : "無數據";
        document.getElementById("left-validity").textContent = `${leftStats.validity_rate.toFixed(1)}%`;

        document.getElementById("right-mean").textContent = `${rightStats.mean_diameter.toFixed(2)} mm`;
        document.getElementById("right-current").textContent = currentSizes.right_eye ? `${currentSizes.right_eye.toFixed(2)} mm` : "無數據";
        document.getElementById("right-validity").textContent = `${rightStats.validity_rate.toFixed(1)}%`;

        // 系統狀態
        document.getElementById("last-update").textContent = new Date(data.timestamp).toLocaleTimeString();
        document.getElementById("data-samples").textContent = leftStats.valid_samples + rightStats.valid_samples;

        // 警報狀態檢查
        let alertStatus = "正常";
        if (data.blink_frequency > 20) alertStatus = "眨眼頻率過高";
        if (leftStats.validity_rate < 50 || rightStats.validity_rate < 50) alertStatus = "數據有效性低";

        document.getElementById("alert-status").textContent = alertStatus;
      }

      // 開始自動更新
      function startAutoUpdate() {
        updateInterval = setInterval(refreshAnalysis, 5000); // 每5秒更新一次
      }

      // 停止自動更新
      function stopAutoUpdate() {
        if (updateInterval) {
          clearInterval(updateInterval);
          updateInterval = null;
        }
      }

      // 顯示載入指示器
      function showLoading(show) {
        const loading = document.getElementById("loading");
        loading.style.display = show ? "block" : "none";
      }

      // 顯示警報
      function showAlert(message, type) {
        // 移除現有警報
        const existingAlert = document.querySelector(".alert");
        if (existingAlert) {
          existingAlert.remove();
        }

        // 創建新警報
        const alert = document.createElement("div");
        alert.className = `alert alert-${type}`;
        alert.innerHTML = `
                <strong>${type === "success" ? "✅" : type === "danger" ? "❌" : "ℹ️"}</strong>
                ${message}
                <button type="button" class="close" onclick="this.parentElement.remove()" style="float: right; background: none; border: none; font-size: 1.5em; cursor: pointer;">&times;</button>
            `;

        // 插入到頁面頂部
        const content = document.querySelector(".content");
        content.insertBefore(alert, content.firstChild);

        // 自動移除警報
        setTimeout(() => {
          if (alert.parentElement) {
            alert.remove();
          }
        }, 5000);
      }

      // 頁面載入時初始化
      document.addEventListener("DOMContentLoaded", function () {
        updateStatus();
        refreshAnalysis();
      });
    </script>
  </body>
</html>
